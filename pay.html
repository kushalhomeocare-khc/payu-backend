<div class="form-card" style="width:88%;max-width:650px;margin:25px auto;text-align:left;background:#fff;padding:24px;border-radius:18px;box-shadow:0 8px 20px rgba(0,0,0,.08)"><h3 style="font-family:Oswald,sans-serif;color:#12cfff">Patient Details</h3><input type="text" id="patientName" placeholder="Patient Name *" style="width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:10px;"><div style="display:flex;gap:10px" class="twocol"><input type="number" id="age" placeholder="Age *" style="flex:1;padding:14px;border:1px solid #ccc;border-radius:10px;"><select id="gender" style="flex:1;padding:14px;border:1px solid #ccc;border-radius:10px;"><option value="">Gender *</option><option>Male</option><option>Female</option><option>Other</option></select></div><input type="email" id="email" placeholder="Email Address *" style="width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:10px;"><input type="tel" id="mobile" placeholder="Mobile Number *" style="width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:10px;"><input type="tel" id="whatsapp" placeholder="WhatsApp Number" style="width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:10px;"><textarea id="address" placeholder="Address *" style="width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:10px;"></textarea><div style="display:flex;gap:10px" class="twocol"><input type="text" id="city" placeholder="City *" style="flex:1;padding:14px;border:1px solid #ccc;border-radius:10px;"><input type="text" id="state" placeholder="State *" style="flex:1;padding:14px;border:1px solid #ccc;border-radius:10px;"></div><div style="display:flex;gap:10px;margin-top:8px"><input type="text" id="zip" placeholder="ZIP / PIN Code *" style="flex:1;padding:14px;border:1px solid #ccc;border-radius:10px;"><input type="text" id="country" placeholder="Country *" style="flex:1;padding:14px;border:1px solid #ccc;border-radius:10px;"></div><textarea id="complaints" rows="5" placeholder="Briefly describe your symptoms, diagnosis (if known), duration of illness, and any treatment taken." style="width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:10px;"></textarea><label><input type="checkbox" id="agree"> I confirm that the information provided is accurate and consent to its use for medical consultation and treatment.</label><p style="font-size:13px;color:#666">🔒 Your personal information is kept strictly confidential and is used only for consultation, treatment, and communication related to your care.</p></div><button

<form id="payuForm" method="post">

<input type="hidden" name="key">

<input type="hidden" name="txnid" id="txnid">

<input type="hidden" name="amount">

<input type="hidden" name="productinfo">

<input type="hidden" name="firstname">

<input type="hidden" name="email">

<input
type="hidden"
name="surl"
>

<input
type="hidden"
name="furl"
>

<input type="hidden" name="hash" id="hash">

<input
type="hidden"
name="service_provider"
value="payu_paisa"
>

</form>

<script>
const urlParams =
new URLSearchParams(window.location.search);

const planid =
urlParams.get("planid") || "CONSULT";

const planData = {

"CONSULT": {
name: "Consultation Fee",
amount: "₹1000"
},

  "TEST": {
name: "Test",
amount: "₹10"
},
  
"1MTP": {
name: "1 Month Treatment Plan",
amount: "₹2500"
},

"3MTP": {
name: "3 Months Treatment Plan",
amount: "₹5500"
},

"6MTP": {
name: "6 Months Treatment Plan",
amount: "₹8500"
},

"12MTP": {
name: "12 Months Treatment Plan",
amount: "₹14500"
}

};

const selectedPlan =
planData[planid];

if (selectedPlan) {

window.onload = function () {

document.getElementById("planName").innerText =
selectedPlan.name;

document.getElementById("planAmount").innerText =
selectedPlan.amount;

};

}

  
async function startPayment() {

const email =
document.getElementById("email").value.trim();

if (!email) {

alert("Please enter email address");

return;

}

const txnid = "TXN" + Date.now();

const firstname = "Patient";

const urlParams =
new URLSearchParams(window.location.search);

const planid =
urlParams.get("planid") || "CONSULT";

document.getElementById("txnid").value = txnid;
const patientName=document.getElementById('patientName').value.trim();const age=document.getElementById('age').value.trim();const gender=document.getElementById('gender').value;const mobile=document.getElementById('mobile').value.trim();const whatsapp=document.getElementById('whatsapp').value.trim();const address=document.getElementById('address').value.trim();const city=document.getElementById('city').value.trim();const state=document.getElementById('state').value.trim();const zip=document.getElementById('zip').value.trim();const country=document.getElementById('country').value.trim();const complaints=document.getElementById('complaints').value.trim();if(!patientName||!age||!gender||!email||!whatsapp||!city||!country||!complaints||!document.getElementById('agree').checked){alert('Please complete all required fields.');return;}const wf=new FormData();wf.append('access_key','db9b8a4b-dccc-4ae6-a459-a11e9058a477');[['Patient Name',patientName],['Age',age],['Gender',gender],['Email',email],['Mobile',mobile],['WhatsApp',whatsapp],['Address',address],['City',city],['State',state],['ZIP/PIN',zip],['Country',country],['Chief Complaints',complaints],['Treatment Plan',selectedPlan.name],['Amount',selectedPlan.amount]].forEach(x=>wf.append(x[0],x[1]));await fetch('https://api.web3forms.com/submit',{method:'POST',body:wf});
// OPTIONAL: Save to Google Sheets (replace YOUR_GOOGLE_SCRIPT_URL)
try{
await fetch("YOUR_GOOGLE_SCRIPT_URL",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
plan:selectedPlan.name,
amount:selectedPlan.amount,
patient_name:patientName,
age:age,
gender:gender,
email:email,
mobile:mobile,
whatsapp:whatsapp,
address:address,
city:city,
state:state,
zip:zip,
country:country,
complaints:complaints
})
});
}catch(e){console.log("Google Sheets sync failed",e);}

try {

const response = await fetch(
"https://payu-backend-ruby.vercel.app/api/generate-hash",
{
method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
txnid,
planid,
firstname,
email
})

}
);

const data = await response.json();

const amount = data.amount;
const productinfo = data.productinfo;
  
document.querySelector('input[name="amount"]').value =
data.amount;

document.querySelector('input[name="productinfo"]').value =
data.productinfo;

document.querySelector('input[name="firstname"]').value =
data.firstname;

document.querySelector('input[name="email"]').value =
data.email;

document.querySelector('input[name="txnid"]').value =
data.txnid;

document.querySelector('input[name="key"]').value =
data.key;

document.querySelector('input[name="surl"]').value =
data.surl;

document.querySelector('input[name="furl"]').value =
data.furl;

document.querySelector('input[name="hash"]').value =
data.hash;

document.getElementById("payuForm").action =
"https://secure.payu.in/_payment";

document.getElementById("payuForm").submit();

}

catch (error) {

console.log(error);

alert("Payment initialization failed");

}

}

</script>
