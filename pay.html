<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kushal Online Payment Page</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

</head>

<body
style="
margin:0;
background:#f5f5f5;
font-family:'Poppins',sans-serif;
color:#000000;
"
>

<div
style="
height:24px;
background:#12cfff;
width:100%;
"
>
</div>

<div
style="
text-align:center;
margin-top:60px;
padding:20px;
"
>

<img
src="/logo.png"
alt="Kushal Online"
style="
width:120px;
max-width:40vw;
margin-bottom:28px;
"
>

<h2
style="
font-family:'Oswald',sans-serif;
color:#12cfff;
font-size:clamp(20px,7vw,34px);
margin-bottom:12px;
letter-spacing:1px;
"
>
Secure Payment | Kushal Online
</h2>

<p
style="
font-size:clamp(16px,4vw,20px);
max-width:450px;
margin:auto;
line-height:1.6;
color:#222;
"
>
Secure checkout powered by PayU.
</p>

<p
style="
font-size:18px;
font-weight:600;
margin-top:28px;
margin-bottom:8px;
color:#111;
"
id="planName"
>
Treatment Plan
</p>

<p
style="
font-size:28px;
font-weight:700;
color:#12cfff;
margin-top:0;
margin-bottom:10px;
font-family:'Oswald',sans-serif;
letter-spacing:1px;
"
id="planAmount"
>
₹0
</p>

  
<input
type="email"
id="email"
placeholder="Enter Email Address"
style="
width:88%;
max-width:420px;
padding:16px 18px;
margin-top:32px;
border-radius:14px;
border:1px solid #cccccc;
font-size:16px;
font-family:'Poppins',sans-serif;
outline:none;
box-sizing:border-box;
"
>

<br>

<button
onclick="startPayment()"
style="
background:#12cfff;
color:#000000;
border:none;
width:88%;
max-width:420px;
padding:20px 18px;
font-size:18px;
font-family:'Poppins',sans-serif;
font-weight:700;
letter-spacing:1px;
border-radius:60px;
margin-top:28px;
cursor:pointer;
box-shadow:0 6px 18px rgba(0,0,0,0.12);
text-transform:uppercase;
"
>
Proceed with PayU Checkout
</button>

</div>

<form id="payuForm" method="post">

<input type="hidden" name="key">

<input type="hidden" name="txnid" id="txnid">

<input type="hidden" name="amount">

<input type="hidden" name="productinfo">

<input type="hidden" name="firstname">

<input type="hidden" name="email">

<input
type="hidden"
name="surl"
>

<input
type="hidden"
name="furl"
>

<input type="hidden" name="hash" id="hash">

<input
type="hidden"
name="service_provider"
value="payu_paisa"
>

</form>

<script>
const urlParams =
new URLSearchParams(window.location.search);

const planid =
urlParams.get("planid") || "CONSULT";

const planData = {

CONSULT: {
name: "Consultation Fee",
amount: "₹1000"
},

2MTP: {
name: "2 Months Treatment Plan",
amount: "₹3400"
},

4MTP: {
name: "4 Months Treatment Plan",
amount: "₹5200"
},

6MTP: {
name: "6 Months Treatment Plan",
amount: "₹7200"
},

12MTP: {
name: "12 Months Treatment Plan",
amount: "₹10800"
}

};

const selectedPlan =
planData[planid];

if (selectedPlan) {

window.onload = function () {

document.getElementById("planName").innerText =
selectedPlan.name;

document.getElementById("planAmount").innerText =
selectedPlan.amount;

};

}

  
async function startPayment() {

const email =
document.getElementById("email").value.trim();

if (!email) {

alert("Please enter email address");

return;

}

const txnid = "TXN" + Date.now();

const firstname = "Patient";

const urlParams =
new URLSearchParams(window.location.search);

const planid =
urlParams.get("planid") || "CONSULT";

document.getElementById("txnid").value = txnid;

try {

const response = await fetch(
"https://payu-backend-ruby.vercel.app/api/generate-hash",
{
method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
txnid,
planid,
firstname,
email
})

}
);

const data = await response.json();

const amount = data.amount;
const productinfo = data.productinfo;
  
document.querySelector('input[name="amount"]').value =
data.amount;

document.querySelector('input[name="productinfo"]').value =
data.productinfo;

document.querySelector('input[name="firstname"]').value =
data.firstname;

document.querySelector('input[name="email"]').value =
data.email;

document.querySelector('input[name="txnid"]').value =
data.txnid;

document.querySelector('input[name="key"]').value =
data.key;

document.querySelector('input[name="surl"]').value =
data.surl;

document.querySelector('input[name="furl"]').value =
data.furl;

document.querySelector('input[name="hash"]').value =
data.hash;

document.getElementById("payuForm").action =
"https://secure.payu.in/_payment";

document.getElementById("payuForm").submit();

}

catch (error) {

console.log(error);

alert("Payment initialization failed");

}

}

</script>

</body>

</html>
