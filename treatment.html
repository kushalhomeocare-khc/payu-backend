<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

<title>Treatment Plan Payment  |  Kushal Online</title>

<link rel="icon" href="favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

</head>

<body
onload="startPayment()"
style="
margin:0;
background:#f5f5f5;
font-family:'Poppins',sans-serif;
color:#000000;
">

<div
style="
height:6px;
background:#12cfff;
width:100%;
">
</div>

<div
style="
text-align:center;
margin-top:70px;
padding:20px;
">

<img
src="logo.png"
style="
width:180px;
max-width:80%;
margin-bottom:30px;
">

<h2
style="
font-family:'Oswald',sans-serif;
color:#12cfff;
font-weight:600;
font-size:34px;
letter-spacing:0.5px;
margin-bottom:12px;
">
Redirecting to Secure Payment...
</h2>

<p
style="
font-family:'Poppins',sans-serif;
color:#000000;
font-size:15px;
line-height:1.6;
max-width:420px;
margin:auto;
">
Please wait while we connect you securely to the payment gateway.
</p>

</div>

<form id="payuForm" method="post">

<input type="hidden" name="key" value="lAaXBo">

<input type="hidden" name="txnid" id="txnid">

<input type="hidden" name="amount" value="3400">

<input type="hidden" name="productinfo" value="Treatment Plan">

<input type="hidden" name="firstname" id="firstname">

<input type="hidden" name="email" id="email">

<input type="hidden" name="phone" id="phone">

<input type="hidden" name="surl"
value="https://payu-backend.vercel.app/treatment-success.html">

<input type="hidden" name="furl"
value="https://payu-backend.vercel.app/treatment-failure.html">

<input type="hidden" name="hash" id="hash">

</form>

<script>

const params = new URLSearchParams(window.location.search);

const patientName = params.get("name");

const patientEmail = params.get("email");

const patientPhone = params.get("phone");

async function startPayment() {

const txnid = "TXN" + Date.now();

document.getElementById("txnid").value = txnid;

document.getElementById("firstname").value = patientName;

document.getElementById("email").value = patientEmail;

document.getElementById("phone").value = patientPhone;

const response = await fetch("/api/generate-hash", {

method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({

txnid: txnid,

amount: "3400",

productinfo: "Treatment Plan",

firstname: patientName,

email: patientEmail,

phone: patientPhone

})

});

const data = await response.json();

document.getElementById("hash").value = data.hash;

document.getElementById("payuForm").action =
"https://secure.payu.in/_payment";

document.getElementById("payuForm").submit();

}

</script>

</body>
</html>
