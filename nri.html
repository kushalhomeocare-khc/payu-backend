<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connecting to WhatsApp | Kushal Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f5f5f5;font-family:'Poppins',sans-serif;color:#222;text-align:center}
.header{display:block;width:100vw;max-width:none;margin:0 calc(50% - 50vw)}
.wrap{max-width:700px;margin:40px auto;padding:20px}
h1{font-family:'Oswald',sans-serif;color:#12cfff;font-size:clamp(28px,6vw,42px);margin:12px 0}
p{font-size:18px;line-height:1.7;color:#555}
.spinner{width:78px;height:78px;border:8px solid #d9f7ff;border-top:8px solid #12cfff;border-radius:50%;margin:35px auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:inline-block;background:#12cfff;color:#000;text-decoration:none;font-weight:700;text-transform:uppercase;padding:14px 29px;font-size:16px;border-radius:60px;box-shadow:0 6px 18px rgba(0,0,0,.12);margin-top:18px}
.note{font-size:14px;color:#777;margin-top:18px}
</style>
</head>
<body>
<img src="/ko_header.png" alt="Kushal Online" class="header">
<div class="wrap">
<div class="spinner"></div>
<h1>Connecting to WhatsApp...</h1>
<p>Please wait while we connect you with our International Patient Support Team.</p>
<a id="wa" class="btn" href="#">CONNECT ON WHATSAPP</a>
<div class="note">If you are not redirected automatically, tap the button above.</div>
</div>
<script>
const msg=encodeURIComponent("Hello Kushal Online,%0A%0AI would like to know the NRI consultation and treatment plan pricing.%0A%0APlease share the available plans and payment details.");
const url="https://wa.me/918429290777?text="+msg;
document.getElementById("wa").href=url;
setTimeout(()=>location.href=url,1000);
</script>
</body>
</html>
