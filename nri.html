<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connecting to WhatsApp | Kushal Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f5f5f5;font-family:Roboto,sans-serif;text-align:center;color:#222}
.header{display:block;width:100vw;max-width:none;margin:0 calc(50% - 50vw)}
.wrap{max-width:700px;margin:40px auto;padding:20px}
h1{font-family:Oswald,sans-serif;color:#12CFFF;font-size:clamp(28px,6vw,42px);margin:12px 0}
p{font-size:18px;line-height:1.7;color:#555}
.spinner{width:78px;height:78px;border:8px solid #d9f7ff;border-top:8px solid #12CFFF;border-radius:50%;margin:35px auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:none;background:#12CFFF;color:#000;text-decoration:none;font-weight:700;text-transform:uppercase;padding:14px 29px;border-radius:60px;font-size:16px}
.note{font-size:14px;color:#777;margin-top:18px}
</style></head><body>
<img src="/ko_header.png" class="header" alt="Kushal Online">
<div class="wrap">
<div class="spinner" id="spin"></div>
<h1>Connecting to WhatsApp...</h1>
<p>Please wait while we connect you with our International Patient Support Team.</p>
<a id="wa" class="btn" href="#">CONNECT ON WHATSAPP</a>
<div class="note" id="note">Preparing secure connection…</div>
</div>
<script>
const msg=encodeURIComponent(`Hello Kushal Online,

I am interested in your Online Homeopathy Treatment.

I would like to enquire about any special offers available for NRI patients.

I look forward to your response.

Thank you.`);
const url="https://api.whatsapp.com/send?phone=918429290777&text="+msg;
document.getElementById("wa").href=url;
setTimeout(function(){
document.getElementById("spin").style.display="none";
document.getElementById("wa").style.display="inline-block";
document.getElementById("note").textContent="Tap the button below to continue to WhatsApp.";
},2500);
</script></body></html>
