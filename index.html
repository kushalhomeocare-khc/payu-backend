<!DOCTYPE html>
<html>

<head>

<title>Kushal Online Payment</title>

<link rel="icon" type="image/x-icon" href="favicon.ico">

<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">

<link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">

<link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

</head>

<body

style="
margin:0;
background:#f5f5f5;
font-family:'Poppins',sans-serif;
color:#000000;
">

<div
style="
height:24px;
background:#12cfff;
width:100%;
">
</div>

<div
style="
text-align:center;
margin-top:70px;
padding:20px;
">

<img
src="logo.png"
style="
width:180px;
max-width:80%;
margin-bottom:30px;
">

<h2
style="
font-family:'Oswald',sans-serif;
color:#12cfff;
font-weight:600;
font-size:34px;
letter-spacing:0.5px;
margin-bottom:12px;
">
Redirecting to Secure Payment...
</h2>

<p
style="
font-family:'Poppins',sans-serif;
color:#000000;
font-size:15px;
line-height:1.6;
max-width:420px;
margin:auto;
">
Please wait while we connect you securely to the payment gateway.
</p>

</div>

<form id="payuForm" method="post">

<input type="hidden" name="key" value="IAaXBo">

<input type="hidden" name="txnid" id="txnid">

<input type="hidden" name="amount" id="amount">

<input type="hidden" name="productinfo" id="productinfo">

<input type="hidden" name="firstname" value="Patient">

<input type="hidden" name="surl" id="surl">

<input type="hidden" name="furl" id="furl">

<input type="hidden" name="hash" id="hash">

</form>

<script>
window.onload = function () {

setTimeout(() => {

startPayment();

}, 1000);

};
async function startPayment() {

const params = new URLSearchParams(window.location.search);

const plan = params.get("plan");

let amount = "";
let productinfo = "";
let surl = "";
let furl = "";

if(plan === "consult") {

amount = "1000";
productinfo = "Consultation Fee";

surl =
"https://payu-backend-ruby.vercel.app/consult-success.html";

furl =
"https://payu-backend-ruby.vercel.app/consult-failure.html";

}

else if(plan === "2mtp") {

amount = "3400";
productinfo = "2 Month Treatment Plan";

surl =
"https://payu-backend-ruby.vercel.app/treatment-success.html";

furl =
"https://payu-backend-ruby.vercel.app/treatment-failure.html";

}

else if(plan === "4mtp") {

amount = "5200";
productinfo = "4 Month Treatment Plan";

surl =
"https://payu-backend-ruby.vercel.app/treatment-success.html";

furl =
"https://payu-backend-ruby.vercel.app/treatment-failure.html";

}

else if(plan === "6mtp") {

amount = "7200";
productinfo = "6 Month Treatment Plan";

surl =
"https://payu-backend-ruby.vercel.app/treatment-success.html";

furl =
"https://payu-backend-ruby.vercel.app/treatment-failure.html";

}

else if(plan === "12mtp") {

amount = "10800";
productinfo = "12 Month Treatment Plan";

surl =
"https://payu-backend-ruby.vercel.app/treatment-success.html";

furl =
"https://payu-backend-ruby.vercel.app/treatment-failure.html";

}

else {

alert("Invalid plan selected");

return;

}

document.getElementById("amount").value = amount;

document.getElementById("productinfo").value = productinfo;

document.getElementById("surl").value = surl;

document.getElementById("furl").value = furl;

const txnid = "TXN" + Date.now();

document.getElementById("txnid").value = txnid;

const response = await fetch(
"https://payu-backend-ruby.vercel.app/api/generate-hash",
{

method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({

txnid: txnid,

amount: amount,

productinfo: productinfo,

firstname: "Patient"

})

});

const data = await response.json();

document.getElementById("hash").value = data.hash;

document.getElementById("payuForm").action =
"https://secure.payu.in/_payment";

document.getElementById("payuForm").submit();

}

</script>

</body>
</html>
